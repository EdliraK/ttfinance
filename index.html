<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyrje — Rakordimi i Arkës</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F6F2E9;
    --paper-raised: #FBF8F2;
    --ink: #1E2636;
    --ink-soft: #5B6472;
    --brass: #9C7A32;
    --brass-light: #C7A968;
    --line: #DBD2BC;
    --stamp-red: #A8382C;
    --stamp-red-bg: rgba(168,56,44,0.07);
    --focus: #2E5FA8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;max-width:380px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:2px;
    padding:36px 32px;
    position:relative;
  }
  .card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:4px;
    background:var(--brass);
  }
  .kicker{
    font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.12em;
    font-size:10.5px;color:var(--brass);text-align:center;margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces',serif;font-weight:700;font-size:26px;text-align:center;
    margin:0 0 28px;letter-spacing:-0.01em;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.08em;
    color:var(--ink-soft);margin-bottom:6px;font-family:'IBM Plex Mono',monospace;
  }
  .field input{
    width:100%;font-family:'IBM Plex Mono',monospace;font-size:14px;
    border:1px solid var(--line);background:var(--paper);
    padding:11px 12px;border-radius:2px;color:var(--ink);
  }
  .field input:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--focus);}

  button.login-btn{
    width:100%;background:var(--ink);color:var(--paper);border:none;
    padding:13px 20px;font-family:'Fraunces',serif;font-weight:600;font-size:16px;
    border-radius:2px;cursor:pointer;margin-top:6px;transition:background .15s ease;
  }
  button.login-btn:hover{background:var(--brass);}
  button.login-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  #err{
    color:var(--stamp-red);background:var(--stamp-red-bg);
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;
    padding:9px 12px;border-radius:2px;margin-top:14px;display:none;text-align:center;
  }
  .foot-note{
    margin-top:22px;font-size:11px;color:var(--ink-soft);text-align:center;
    font-family:'IBM Plex Mono',monospace;line-height:1.5;
  }
</style>
</head>
<body>
  <form class="card" id="loginForm" autocomplete="off">
    <div class="kicker">Zyrë Këmbimi Valutor</div>
    <h1>Hyrje në Sistem</h1>

    <div class="field">
      <label for="user">Kodi i Operatorit</label>
      <input id="user" name="user" type="text" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="pass">Fjalëkalimi</label>
      <input id="pass" name="pass" type="password" autocomplete="current-password" required>
    </div>

    <button class="login-btn" type="submit">Hyr →</button>
    <div id="err">Kodi ose fjalëkalimi janë gabim.</div>

    <div class="foot-note">
      Kontroll i brendshëm i qasjes — për ndryshim operatorësh/fjalëkalimesh,
      redaktohet lista <code>OPERATORS</code> në fillim të skriptit të kësaj faqeje.
    </div>
  </form>

<script>
// ⚠️ Kjo ËSHTË vetëm një portë hyrjeje në shfletues — jo siguri e vërtetë.
// Çdokush teknik mund të shohë kodin burimor dhe këto kredenciale. Për siguri
// reale duhet një server/bazë të dhënash. Përshtat listën më poshtë:
const OPERATORS = [
  { user: 'admin',    pass: '1234', name: 'Administrator' },
  { user: 'turni1',   pass: '1111', name: 'Operator Turni 1' },
  { user: 'turni2',   pass: '2222', name: 'Operator Turni 2' },
];

const form = document.getElementById('loginForm');
const err = document.getElementById('err');

// Nëse ka sesion aktiv, kalo direkt te rakordimi
try {
  const existing = JSON.parse(sessionStorage.getItem('raa_session') || 'null');
  if (existing && existing.authed) window.location.href = 'rakordimi_arkes.html';
} catch(e) {}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const u = document.getElementById('user').value.trim();
  const p = document.getElementById('pass').value;
  const match = OPERATORS.find(o => o.user === u && o.pass === p);
  if (!match) {
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';
  try {
    sessionStorage.setItem('raa_session', JSON.stringify({ authed: true, user: match.user, name: match.name }));
  } catch(e) {}
  window.location.href = 'rakordimi_arkes.html';
});
</script>
</body>
</html>
